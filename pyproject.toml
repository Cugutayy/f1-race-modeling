[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-race-research"
version = "0.2.0"
description = "Event-time F1 forecasting, live race intelligence and strategy simulation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2,<4",
    "scikit-learn>=1.3,<2",
    "scipy>=1.11,<2",
    "requests>=2.31,<3",
    "joblib>=1.4,<2",
]

[project.optional-dependencies]
telemetry = ["fastf1>=3.6,<4", "matplotlib>=3.8,<4"]
app = ["streamlit>=1.45,<2", "altair>=5,<7"]
live = ["paho-mqtt>=2.1,<3"]
api = ["fastapi>=0.137,<1", "uvicorn[standard]>=0.49,<1"]
modern = ["xgboost>=3,<4", "lightgbm>=4,<5", "catboost>=1.2,<2"]
foundation = ["tabicl>=2.2,<3"]
dev = ["pytest>=8", "ruff>=0.9"]
all = [
    "fastf1>=3.6,<4", "matplotlib>=3.8,<4", "streamlit>=1.45,<2", "altair>=5,<7",
    "paho-mqtt>=2.1,<3", "fastapi>=0.137,<1", "uvicorn[standard]>=0.49,<1",
    "xgboost>=3,<4", "lightgbm>=4,<5", "catboost>=1.2,<2",
    "tabicl>=2.2,<3", "pytest>=8", "ruff>=0.9",
]

[project.scripts]
f1-research = "f1_research.cli:main"
f1-live = "f1_research.openf1_live:main"
f1-openf1-doctor = "f1_research.openf1_doctor:main"
f1-laps = "f1_research.lap_pipeline:main"
f1-laps-strict = "f1_research.strict_pipeline:main"
f1-api = "f1_research.scoped_live_api:main"
f1-reconcile = "f1_research.provider_reconciliation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
