name: Sealed model evidence
# Produces benchmark, model manifest, model bytes and calibration from the same release run.
on:
  workflow_dispatch:
  push:
    branches: [main, feat/production-readiness-v1]
    paths:
      - '.github/workflows/model-evidence.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: sealed-model-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pip install 'xgboost>=3,<4' 'lightgbm>=4,<5' 'catboost>=1.2,<2'
      - name: Collect real historical results
        run: |
          python -m f1_research collect \
            --years 2018 2019 2020 2021 2022 2023 2024 2025 2026 \
            --output reports/model-release/history.csv \
            --cache data/jolpica-cache
      - name: Build sealed release
        run: |
          python -m f1_research.release \
            --input reports/model-release/history.csv \
            --output reports/model-release/release \
            --test-events 12 --tuning-events 8 --calibration-events 6 --min-fit-events 30 \
            --modern-models hist_gradient_boosting,extra_trees,xgboost,lightgbm,catboost
      - name: Download real data-truth evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 35284249763 --repo "${{ github.repository }}" \
            --name data-truth-matrix-35284249763 --dir reports/final/data-truth
      - name: Download real replay evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 35284327579 --repo "${{ github.repository }}" \
            --name real-replay-2025-australia-35284327579 --dir reports/final/replay
      - name: Run final production gate
        run: |
          f1-production-check \
            --data-truth reports/final/data-truth/data_truth_matrix.json \
            --benchmark reports/model-release/release/benchmark/report.json \
            --manifest reports/model-release/release/model_manifest.json \
            --model reports/model-release/release/model.joblib \
            --calibration reports/model-release/release/calibration.json \
            --replay-capture reports/final/replay/source/events.jsonl \
            --output reports/final/production-readiness.json
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-model-release-${{ github.run_id }}
          path: reports/model-release
          if-no-files-found: error
          retention-days: 90
