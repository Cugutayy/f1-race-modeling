name: Sealed model evidence
# Produces benchmark, model manifest, model bytes and calibration from the same release run.
on:
  workflow_dispatch:
  push:
    branches: [feat/production-readiness-v1]
    paths:
      - '.github/workflows/model-evidence.yml'
permissions:
  contents: read
concurrency:
  group: sealed-model-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pip install 'xgboost>=3,<4' 'lightgbm>=4,<5' 'catboost>=1.2,<2'
      - name: Collect real historical results
        run: |
          python -m f1_research collect \
            --years 2018 2019 2020 2021 2022 2023 2024 2025 2026 \
            --output reports/model-release/history.csv \
            --cache data/jolpica-cache
      - name: Build sealed release
        run: |
          python -m f1_research.release \
            --input reports/model-release/history.csv \
            --output reports/model-release/release \
            --test-events 12 --tuning-events 8 --calibration-events 6 --min-fit-events 30 \
            --modern-models hist_gradient_boosting,extra_trees,xgboost,lightgbm,catboost
      - name: Verify sealed release contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from f1_research.model_registry import load_manifest, sha256_file

          root = Path("reports/model-release/release")
          release = json.loads((root / "release.json").read_text())
          report = json.loads((root / "benchmark/report.json").read_text())
          manifest = load_manifest(root / "model_manifest.json", model_path=root / "model.joblib")
          assert report["schema_version"] == 2
          assert report["audit"]["test_updates_model"] is False
          assert report["winner_calibration"], "missing calibration/ECE evidence"
          assert release["model_training_blocks"] == ["fit", "tuning"]
          assert release["calibration_used_for_model_fit"] is False
          assert manifest.benchmark_run_id == report["run_id"]
          assert manifest.calibration_sha256 == sha256_file(root / "calibration.json")
          test = set(report["audit"]["split"]["test"])
          assert {row["event_id"] for row in report["predictions"]} == test
          print("sealed release contract verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-model-release-${{ github.run_id }}
          path: reports/model-release
          if-no-files-found: error
          retention-days: 90
