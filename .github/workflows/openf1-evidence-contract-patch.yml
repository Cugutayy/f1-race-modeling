name: Temporary OpenF1 evidence contract patch

on:
  push:
    branches:
      - audit/openf1-evidence-contract-v2
    paths:
      - .github/workflows/openf1-evidence-contract-patch.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/openf1-evidence-contract-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply evidence contract hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # OpenF1 client: immutable request-level provenance for every successful GET.
          replace_once(
              'src/f1_research/openf1_live.py',
              '        self.session = requests.Session()\n        retry = Retry(\n',
              '        self.session = requests.Session()\n        self.provenance: list[dict[str, Any]] = []\n        retry = Retry(\n',
          )
          replace_once(
              'src/f1_research/openf1_live.py',
              '''        response = self.session.get(url, timeout=self.timeout_s)\n        response.raise_for_status()\n        payload = response.json()\n        if not isinstance(payload, list) or any(not isinstance(row, dict) for row in payload):\n            raise ValueError(f"Unexpected OpenF1 response for {endpoint}")\n        return payload\n''',
              '''        response = self.session.get(url, timeout=self.timeout_s)\n        response.raise_for_status()\n        retrieved_at = datetime.now(UTC).isoformat()\n        raw_bytes = response.content\n        payload = response.json()\n        if not isinstance(payload, list) or any(not isinstance(row, dict) for row in payload):\n            raise ValueError(f"Unexpected OpenF1 response for {endpoint}")\n        self.provenance.append({\n            "provider": "OpenF1",\n            "endpoint": endpoint,\n            "url": response.url or url,\n            "retrieved_at": retrieved_at,\n            "sha256": hashlib.sha256(raw_bytes).hexdigest(),\n            "row_count": len(payload),\n            "http_status": int(response.status_code),\n        })\n        return payload\n''',
          )

          # Event identity: missing cancellation evidence must not mean False/not-cancelled.
          replace_once(
              'src/f1_research/provider_event_identity.py',
              '''        passed=not any(value is True for value in cancelled.values()),\n        required=True,\n        reason="A cancelled OpenF1 meeting/session cannot be reconciled as a completed race.",\n''',
              '''        passed=(\n            openf1.get("session_cancelled") is False\n            and openf1.get("meeting_cancelled") is False\n        ),\n        required=True,\n        reason=(\n            "OpenF1 meeting/session cancellation flags must both be explicitly observed False; "\n            "missing evidence is not treated as not-cancelled."\n        ),\n''',
          )

          # OpenF1 starting-grid evidence becomes a real secondary comparable field.
          replace_once(
              'src/f1_research/provider_reconciliation.py',
              '''    "grid_position": (\n        "Jolpica/FastF1 starting-grid position when supplied. OpenF1 session_result has "\n        "no directly equivalent field in this reconciliation contract."\n    ),\n''',
              '''    "grid_position": (\n        "Provider starting-grid position: Jolpica Results.grid, OpenF1 starting_grid.position, "\n        "and FastF1 Results.GridPosition. Missing rows remain UNKNOWN and are never zero-filled."\n    ),\n''',
          )
          replace_once(
              'src/f1_research/provider_reconciliation.py',
              '''def normalize_openf1_results(\n    result_rows: list[dict[str, Any]],\n    driver_rows: list[dict[str, Any]] | None = None,\n    pit_rows: list[dict[str, Any]] | None = None,\n) -> list[ResultRow]:\n''',
              '''def normalize_openf1_results(\n    result_rows: list[dict[str, Any]],\n    driver_rows: list[dict[str, Any]] | None = None,\n    pit_rows: list[dict[str, Any]] | None = None,\n    starting_grid_rows: list[dict[str, Any]] | None = None,\n) -> list[ResultRow]:\n''',
          )
          replace_once(
              'src/f1_research/provider_reconciliation.py',
              '''    pit_evidence = pit_rows is not None\n    pit_keys: dict[int, set[tuple[Any, Any]]] = {}\n''',
              '''    grid_evidence = starting_grid_rows is not None\n    grid_lookup: dict[int, int] = {}\n    for raw in starting_grid_rows or []:\n        if not isinstance(raw, dict):\n            raise ValueError("OpenF1 starting-grid row must be an object")\n        number = _positive_int(raw.get("driver_number"))\n        position = _positive_int(raw.get("position"), allow_zero=True)\n        if number is None or position is None:\n            raise ValueError("OpenF1 starting-grid row has invalid driver_number/position")\n        if number in grid_lookup:\n            raise ValueError(f"OpenF1 starting-grid has duplicate driver_number {number}")\n        grid_lookup[number] = position\n\n    pit_evidence = pit_rows is not None\n    pit_keys: dict[int, set[tuple[Any, Any]]] = {}\n''',
          )
          replace_once(
              'src/f1_research/provider_reconciliation.py',
              '            grid_position=None,\n            pit_stops=(len(pit_keys.get(number, set())) if pit_evidence else None),\n',
              '            grid_position=(grid_lookup.get(number) if grid_evidence else None),\n            pit_stops=(len(pit_keys.get(number, set())) if pit_evidence else None),\n',
          )
          replace_once(
              'src/f1_research/provider_reconciliation.py',
              '''        "session_result": client.get("session_result", session_key=int(session_key)),\n        "drivers": client.get("drivers", session_key=int(session_key)),\n        "laps": client.get("laps", session_key=int(session_key)),\n        "pit": client.get("pit", session_key=int(session_key)),\n    }\n''',
              '''        "session_result": client.get("session_result", session_key=int(session_key)),\n        "drivers": client.get("drivers", session_key=int(session_key)),\n        "laps": client.get("laps", session_key=int(session_key)),\n        "pit": client.get("pit", session_key=int(session_key)),\n        "starting_grid": client.get("starting_grid", session_key=int(session_key)),\n        "provenance": list(client.provenance),\n    }\n''',
          )
          replace_once(
              'src/f1_research/provider_reconciliation.py',
              '''    openf1_rows = normalize_openf1_results(\n        openf1["session_result"],\n        openf1["drivers"],\n        openf1["pit"],\n    )\n''',
              '''    openf1_rows = normalize_openf1_results(\n        openf1["session_result"],\n        openf1["drivers"],\n        openf1["pit"],\n        openf1.get("starting_grid"),\n    )\n''',
          )

          # Resilient network audit consumes the new starting-grid evidence too.
          replace_once(
              'src/f1_research/provider_audit.py',
              '''            normalized["OpenF1"] = normalize_openf1_results(\n                raw["OpenF1"]["session_result"],\n                raw["OpenF1"]["drivers"],\n                raw["OpenF1"]["pit"],\n            )\n''',
              '''            normalized["OpenF1"] = normalize_openf1_results(\n                raw["OpenF1"]["session_result"],\n                raw["OpenF1"]["drivers"],\n                raw["OpenF1"]["pit"],\n                raw["OpenF1"].get("starting_grid"),\n            )\n''',
          )

          # Tests: cancellation UNKNOWN fails closed.
          p = Path('tests/test_provider_event_identity.py')
          text = p.read_text(encoding='utf-8')
          text += '''\n\ndef test_missing_cancellation_evidence_is_not_treated_as_false():\n    jolpica, openf1, fastf1 = _raw_triplet()\n    openf1 = copy.deepcopy(openf1)\n    openf1["session"].pop("is_cancelled")\n\n    identity = _identity(jolpica, openf1, fastf1)\n    assert identity["verified"] is False\n    assert "not_cancelled" in identity["failures"]\n    assert identity["checks"]["not_cancelled"]["values"]["openf1_session"] is None\n'''
          p.write_text(text, encoding='utf-8')

          # Tests: starting-grid observed/missing/duplicate semantics.
          p = Path('tests/test_provider_reconciliation.py')
          text = p.read_text(encoding='utf-8')
          text += '''\n\ndef test_openf1_starting_grid_is_observed_without_zero_filling_missing_driver():\n    grid = [\n        {"driver_number": 1, "position": 1},\n        {"driver_number": 4, "position": 2},\n    ]\n    normalized = normalize_openf1_results(_openf1_rows(), _openf1_drivers(), None, grid)\n    by_number = {row.driver_number: row for row in normalized}\n    assert by_number[1].grid_position == 1\n    assert by_number[4].grid_position == 2\n    assert by_number[14].grid_position is None\n\n\ndef test_openf1_duplicate_starting_grid_driver_is_rejected():\n    grid = [\n        {"driver_number": 1, "position": 1},\n        {"driver_number": 1, "position": 2},\n    ]\n    with pytest.raises(ValueError, match="duplicate driver_number"):\n        normalize_openf1_results(_openf1_rows(), _openf1_drivers(), None, grid)\n'''
          p.write_text(text, encoding='utf-8')

          # Tests: response-byte provenance with URL, timestamp, SHA and row count.
          Path('tests/test_openf1_client_provenance.py').write_text('''import hashlib\nfrom datetime import datetime\n\nfrom f1_research.openf1_live import OpenF1Client\n\n\nclass _FakeResponse:\n    def __init__(self):\n        self.content = b'[{"driver_number":4}]'\n        self.url = "https://api.openf1.org/v1/drivers?session_key=9693"\n        self.status_code = 200\n\n    def raise_for_status(self):\n        return None\n\n    def json(self):\n        return [{"driver_number": 4}]\n\n\ndef test_openf1_get_records_response_byte_provenance(monkeypatch):\n    client = OpenF1Client()\n    response = _FakeResponse()\n    monkeypatch.setattr(client.session, "get", lambda *_args, **_kwargs: response)\n\n    rows = client.get("drivers", session_key=9693)\n\n    assert rows == [{"driver_number": 4}]\n    assert len(client.provenance) == 1\n    record = client.provenance[0]\n    assert record["provider"] == "OpenF1"\n    assert record["endpoint"] == "drivers"\n    assert record["url"] == response.url\n    assert record["sha256"] == hashlib.sha256(response.content).hexdigest()\n    assert record["row_count"] == 1\n    assert record["http_status"] == 200\n    datetime.fromisoformat(record["retrieved_at"])\n''', encoding='utf-8')
          PY
      - name: Install project dependencies
        run: python -m pip install -r requirements-lock.txt && python -m pip install -e . --no-deps
      - name: Targeted lint and data-contract tests
        run: |
          ruff check src/f1_research/openf1_live.py src/f1_research/provider_event_identity.py src/f1_research/provider_reconciliation.py src/f1_research/provider_audit.py tests/test_openf1_client_provenance.py tests/test_provider_event_identity.py tests/test_provider_reconciliation.py tests/test_provider_reconciliation_semantics.py tests/test_provider_reconciliation_position_semantics.py tests/test_provider_audit.py tests/test_provider_audit_semantics_v2.py
          pytest -q tests/test_openf1_client_provenance.py tests/test_provider_event_identity.py tests/test_provider_reconciliation.py tests/test_provider_reconciliation_semantics.py tests/test_provider_reconciliation_position_semantics.py tests/test_provider_audit.py tests/test_provider_audit_semantics_v2.py
      - name: Commit verified source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/f1_research/openf1_live.py src/f1_research/provider_event_identity.py src/f1_research/provider_reconciliation.py src/f1_research/provider_audit.py tests/test_openf1_client_provenance.py tests/test_provider_event_identity.py tests/test_provider_reconciliation.py
          git commit -m "Harden OpenF1 evidence provenance and grid reconciliation" || exit 0
          git push origin HEAD:audit/openf1-evidence-contract-v2
