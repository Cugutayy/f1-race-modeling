name: Feature full regression checks
on:
  workflow_dispatch:
  push:
    branches: [feat/production-readiness-v1]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements-lock.txt'
      - '.github/workflows/release-checks.yml'
permissions:
  contents: read

concurrency:
  group: feature-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - name: Static analysis
        run: python -m ruff check .
      - name: Full test suite
        run: python -m pytest -q
      - name: Deterministic demo smoke
        run: python -m f1_research demo --output reports/final-demo
