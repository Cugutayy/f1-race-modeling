name: Final release checks

on:
  pull_request:
  push:
    branches: [main, feat/production-readiness-v1]

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,api]"
      - name: Production contract tests
        run: >
          pytest -q
          tests/test_asof_contract.py
          tests/test_feature_provenance.py
          tests/test_prediction_ledger.py
          tests/test_model_registry.py
          tests/test_production_check.py
          tests/test_replay.py
          tests/test_live_protocol.py
          tests/test_live_quality.py
          tests/test_monitoring.py
          tests/test_race_control.py
          tests/test_counterfactual.py
          tests/test_release_manifest.py
          tests/test_drift.py
      - name: Import production surfaces
        run: |
          python - <<'PY'
          import f1_research.counterfactual
          import f1_research.drift
          import f1_research.live_protocol
          import f1_research.model_registry
          import f1_research.prediction_engine
          import f1_research.production_check
          import f1_research.race_control
          import f1_research.release
          import f1_research.replay
          print("production imports: ok")
          PY
