name: Modern historical benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - feature/live-race-intelligence
    paths:
      - 'src/f1_research/data.py'
      - 'src/f1_research/features.py'
      - 'src/f1_research/modern_models.py'
      - 'src/f1_research/plackett_luce.py'
      - 'src/f1_research/rank_ensemble.py'
      - 'src/f1_research/evaluation_v2.py'
      - 'src/f1_research/benchmark_evidence.py'
      - 'pyproject.toml'
      - '.github/workflows/modern-benchmark.yml'

permissions:
  contents: read

concurrency:
  group: modern-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install benchmark dependencies
        run: python -m pip install -e '.[modern,dev]'
      - name: Collect completed 2022-2026 races with provenance
        run: |
          python -m f1_research collect \
            --years 2022 2023 2024 2025 2026 \
            --output reports/modern/history.csv \
            --cache .cache/jolpica
      - name: Run disjoint sealed benchmark
        run: |
          python -m f1_research benchmark-v2 \
            --input reports/modern/history.csv \
            --output reports/modern/benchmark \
            --test-events 12 \
            --tuning-events 6 \
            --calibration-events 4 \
            --min-fit-events 20 \
            --models hist_gradient_boosting extra_trees xgboost lightgbm catboost \
            --max-specs-per-model 2
      - name: Add whole-event bootstrap uncertainty
        run: |
          python -m f1_research.benchmark_evidence \
            --metrics reports/modern/benchmark/fold_metrics.csv \
            --output reports/modern/benchmark/evidence \
            --samples 10000
      - name: Print sealed summary
        run: |
          cat reports/modern/benchmark/summary.csv
          echo '--- paired winner log loss ---'
          python - <<'PY'
          import pandas as pd
          evidence = pd.read_csv('reports/modern/benchmark/evidence/paired_comparisons.csv')
          print(evidence[evidence.metric.eq('winner_log_loss')].to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: modern-historical-benchmark-${{ github.sha }}
          path: |
            reports/modern/history.csv
            reports/modern/history.provenance.json
            reports/modern/benchmark/
          retention-days: 14
          if-no-files-found: error
