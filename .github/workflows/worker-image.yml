name: Worker image checks

on:
  pull_request:
    paths:
      - 'Dockerfile.worker'
      - 'compose.live.yaml'
      - '.dockerignore'
      - 'reports/local/model_evidence.json'
      - 'pyproject.toml'
      - 'src/**'
      - '.github/workflows/worker-image.yml'
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.worker'
      - 'compose.live.yaml'
      - '.dockerignore'
      - 'reports/local/model_evidence.json'
      - 'pyproject.toml'
      - 'src/**'
      - '.github/workflows/worker-image.yml'

permissions:
  contents: read

concurrency:
  group: worker-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose configuration
        env:
          OPENF1_TOKEN: ci-placeholder
          F1_API_TOKEN: ci-placeholder
        run: |
          docker compose -f compose.live.yaml config --quiet
          docker compose -f compose.live.yaml config --format json > /tmp/compose.json
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("/tmp/compose.json").read_text())
          volumes = config["services"]["api"].get("volumes", [])
          targets = {
              volume.get("target")
              for volume in volumes
              if isinstance(volume, dict)
          }
          assert "/models" not in targets, "compose must not shadow bundled /models evidence"
          assert "/models/lap-strict" in targets, "strict model mount must use /models/lap-strict"
          environment = config["services"]["api"].get("environment", {})
          assert environment.get("F1_STRICT_RELEASE_MANIFEST_PATH") == (
              "/models/lap-strict/strict_release_manifest.json"
          )
          PY
      - name: Build persistent worker image
        run: docker build -f Dockerfile.worker -t f1-race-worker:ci .
      - name: Smoke-test installed entrypoints and bundled evidence
        run: |
          docker run --rm --entrypoint sh f1-race-worker:ci -c \
            'command -v f1-api && command -v f1-live && command -v f1-openf1-doctor && test -s /models/model_evidence.json'
          docker run --rm --entrypoint python f1-race-worker:ci -c \
            "import json,pathlib; d=json.loads(pathlib.Path('/models/model_evidence.json').read_text()); r=d['model_release']; assert d['schema_version'] == 1; assert d['evidence_kind'] == 'retrospective_sealed_historical_benchmark'; assert d['sealed_test_events'] > 0; assert len(r['git_sha']) in (40,64); assert len(r['model_sha256']) == 64; assert len(r['model_manifest_sha256']) == 64"
