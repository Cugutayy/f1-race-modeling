name: Real provider data-truth audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.release-trigger'
permissions:
  contents: read
concurrency:
  group: real-provider-data-truth
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        event:
          - {year: 2023, round: 3, session_key: 7787}
          - {year: 2024, round: 1, session_key: 9472}
          - {year: 2024, round: 5, session_key: 9673}
          - {year: 2024, round: 6, session_key: 9507}
          - {year: 2024, round: 8, session_key: 9523}
          - {year: 2024, round: 9, session_key: 9531}
          - {year: 2024, round: 14, session_key: 9574}
          - {year: 2024, round: 2, session_key: 9480}
          - {year: 2024, round: 23, session_key: 9655}
          - {year: 2025, round: 1, session_key: 9693}
          - {year: 2024, round: 3, session_key: 9488}
          - {year: 2024, round: 4, session_key: 9496}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pip install 'fastf1>=3.6,<4'
      - name: Audit real completed race
        continue-on-error: true
        env:
          YEAR: ${{ matrix.event.year }}
          ROUND: ${{ matrix.event.round }}
          SESSION_KEY: ${{ matrix.event.session_key }}
        run: |
          python -m f1_research.provider_audit \
            --year "$YEAR" --round "$ROUND" --openf1-session-key "$SESSION_KEY" \
            --cache data/reconciliation-cache --output "reports/reconciliation/$YEAR-R$ROUND"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-audit-${{ matrix.event.year }}-R${{ matrix.event.round }}
          path: reports/reconciliation
          if-no-files-found: error
          retention-days: 90

  aggregate:
    if: always()
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - uses: actions/download-artifact@v4
        with:
          pattern: real-audit-*
          path: reports/real-audits
      - name: Require all expected audit artifacts
        run: |
          count="$(find reports/real-audits -name reconciliation.json -type f | wc -l)"
          test "$count" -eq 12 || { echo "Expected 12 reconciliation artifacts, found $count"; exit 1; }
      - name: Build data-truth matrix and report
        run: |
          mapfile -t files < <(find reports/real-audits -name reconciliation.json -type f | sort)
          python -m f1_research.provider_matrix "${files[@]}" --output reports/data-truth
          python -m f1_research.data_truth_report reports/data-truth/data_truth_matrix.json \
            --output reports/data-truth/DATA_TRUTH_REPORT.md
          python - <<'PY'
          import json
          from pathlib import Path
          matrix = json.loads(Path("reports/data-truth/data_truth_matrix.json").read_text())
          expected = {
              (2023, 3, 7787), (2024, 1, 9472), (2024, 5, 9673), (2024, 6, 9507),
              (2024, 2, 9480), (2024, 3, 9488), (2024, 4, 9496),
              (2024, 8, 9523), (2024, 9, 9531), (2024, 14, 9574),
              (2024, 23, 9655), (2025, 1, 9693),
          }
          actual = {
              (int(row["year"]), int(row["round_number"]), int(row["openf1_session_key"]))
              for row in matrix["events"]
          }
          if actual != expected:
              raise SystemExit(f"Audit identity set mismatch: missing={sorted(expected-actual)} extra={sorted(actual-expected)}")
          print("verified exact 12-event audit identity set")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: data-truth-matrix-${{ github.run_id }}
          path: reports/data-truth
          if-no-files-found: error
          retention-days: 90
