name: Web checks

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  push:
    branches:
      - feature/live-race-intelligence
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      F1_BACKEND_URL: http://127.0.0.1:8000
      F1_BACKEND_TOKEN: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
