name: Web checks

on:
  pull_request:
    paths:
      - 'web/**'
      - 'vercel.json'
      - '.vercelignore'
      - '.github/workflows/web.yml'
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'vercel.json'
      - '.vercelignore'
      - '.github/workflows/web.yml'

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      F1_BACKEND_URL: http://127.0.0.1:8000
      F1_BACKEND_TOKEN: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install web dependencies
        run: npm install --prefix web --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck --prefix web
      - name: Next production build
        run: npm run build --prefix web
      - name: Vercel root-command smoke test
        run: |
          node -e "const c=require('./vercel.json'); if(c.installCommand!=='npm install --prefix web --no-audit --no-fund') process.exit(1); if(c.buildCommand!=='npm run build --prefix web') process.exit(1); if(c.outputDirectory!=='web/.next') process.exit(1)"
          test -d web/.next
