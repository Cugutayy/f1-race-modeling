name: Validate status semantic split fixed

on:
  push:
    branches:
      - audit/status-semantics-v4

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - name: Apply semantic patch
        run: python -c "import base64,zlib;exec(zlib.decompress(base64.b64decode(''))).decode())"
      - name: Ruff
        run: python -m ruff check src/f1_research/provider_reconciliation.py tests/test_provider_reconciliation.py tests/test_provider_reconciliation_semantics.py tests/test_provider_reconciliation_position_semantics.py
      - name: Targeted tests
        run: python -m pytest -q tests/test_provider_reconciliation.py tests/test_provider_reconciliation_semantics.py tests/test_provider_reconciliation_position_semantics.py tests/test_provider_event_identity.py tests/test_openf1_client_provenance.py
      - name: Real Australia audit
        run: python -m f1_research.provider_audit --year 2025 --round 1 --openf1-session-key 9693 --cache data/reconciliation-cache --output reports/status-v4-australia
      - name: Verify Australia semantics
        run: python -c "import json,pathlib; r=json.loads(pathlib.Path('reports/status-v4-australia/reconciliation.json').read_text()); assert r['hard_mismatch_count']==0,r['mismatches']; assert r['verification_status']=='PASS_WITH_GAPS',r['verification_status']; h={x['driver_number']:x for x in r['normalized']['OpenF1']}[6]; assert h['status_class']=='dns'; assert h['result_class']=='non_finisher'; assert h['start_status']=='dns'; print({'status':r['verification_status'],'hard':r['hard_mismatch_count'],'gaps':r['insufficient_hard_count'],'hadjar':h})"
      - name: Commit verified source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/f1_research/provider_reconciliation.py tests/test_provider_reconciliation.py
          git commit -m 'Separate result and start status semantics'
          git push origin HEAD:audit/status-semantics-v4
