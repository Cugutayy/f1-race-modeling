name: Real provider matrix audit
# Evidence rerun: missing classified provider fields are explicit gaps, not contradictions.
on:
  workflow_dispatch:
  push:
    branches: [audit/real-race-matrix-v1]
    paths:
      - '.github/workflows/real-provider-matrix-audit.yml'
permissions:
  contents: read
concurrency:
  group: real-provider-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        event:
          - {year: 2023, round: 3, session_key: 7787}
          - {year: 2024, round: 1, session_key: 9472}
          - {year: 2024, round: 5, session_key: 9673}
          - {year: 2024, round: 6, session_key: 9507}
          - {year: 2024, round: 8, session_key: 9523}
          - {year: 2024, round: 9, session_key: 9531}
          - {year: 2024, round: 14, session_key: 9574}
          - {year: 2024, round: 21, session_key: 9636}
          - {year: 2024, round: 23, session_key: 9655}
          - {year: 2025, round: 1, session_key: 9693}
          - {year: 2025, round: 2, session_key: 9998}
          - {year: 2026, round: 1, session_key: 11234}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pip install 'fastf1>=3.6,<4'
      - name: Audit real completed race
        env:
          YEAR: ${{ matrix.event.year }}
          ROUND: ${{ matrix.event.round }}
          SESSION_KEY: ${{ matrix.event.session_key }}
        run: |
          python -m f1_research.provider_audit --year "$YEAR" --round "$ROUND" --openf1-session-key "$SESSION_KEY" --cache data/reconciliation-cache --output "reports/reconciliation/$YEAR-R$ROUND"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-audit-${{ matrix.event.year }}-R${{ matrix.event.round }}
          path: reports/reconciliation
          if-no-files-found: error
          retention-days: 30

  aggregate:
    if: always()
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - uses: actions/download-artifact@v4
        with:
          pattern: real-audit-*
          path: reports/real-audits
      - name: Require all 12 reconciliation artifacts
        run: |
          count="$(find reports/real-audits -name reconciliation.json -type f | wc -l)"
          test "$count" -eq 12 || { echo "Expected 12 artifacts, found $count"; exit 1; }
      - name: Aggregate evidence
        run: |
          mapfile -t files < <(find reports/real-audits -name reconciliation.json -type f | sort)
          python -m f1_research.provider_matrix "${files[@]}" --output reports/data-truth
          python -m f1_research.data_truth_report reports/data-truth/data_truth_matrix.json --output reports/data-truth/DATA_TRUTH_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: data-truth-matrix-${{ github.run_id }}
          path: reports/data-truth
          if-no-files-found: error
          retention-days: 90
