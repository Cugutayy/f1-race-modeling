name: Provider reconciliation

on:
  workflow_dispatch:
    inputs:
      year:
        description: Completed F1 season year
        required: true
        default: '2026'
      round:
        description: Completed championship round number
        required: true
      openf1_session_key:
        description: Explicit OpenF1 Race session_key for the same event
        required: true
  push:
    branches:
      - audit/replay-2025-australia-schema-v4

permissions:
  contents: read

concurrency:
  group: provider-reconciliation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - name: Install FastF1 comparison provider
        run: python -m pip install 'fastf1>=3.6,<4'
      - name: Audit completed race across Jolpica, OpenF1 and FastF1
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            YEAR='2025'
            ROUND='1'
            SESSION_KEY='9693'
            OUTPUT='reports/reconciliation/2025-R1-merged-schema-v4'
          else
            YEAR='${{ inputs.year }}'
            ROUND='${{ inputs.round }}'
            SESSION_KEY='${{ inputs.openf1_session_key }}'
            OUTPUT="reports/reconciliation/${YEAR}-R${ROUND}"
          fi
          python -m f1_research.provider_audit \
            --year "$YEAR" \
            --round "$ROUND" \
            --openf1-session-key "$SESSION_KEY" \
            --cache data/reconciliation-cache \
            --output "$OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-reconciliation-${{ github.run_id }}
          path: reports/reconciliation
          if-no-files-found: error
          retention-days: 30
