name: Validate status semantic split

on:
  push:
    branches:
      - audit/status-semantics-v4

permissions:
  contents: write

jobs:
  patch-test-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - name: Apply semantic split and regression tests
        run: |
          python - <<'PY'
          from pathlib import Path

          src_path = Path('src/f1_research/provider_reconciliation.py')
          text = src_path.read_text()

          def one(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one source match, got {count}: {old[:100]!r}')
              text = text.replace(old, new)

          one(
              'HARD_FIELDS = ("position", "laps", "status_class")',
              'HARD_FIELDS = ("position", "laps", "result_class", "start_status")',
          )
          one(
              '    "status_class": (\n'
              '        "Conservative normalized class: finished, classified_lapped, dnf, dns or dsq. "\n'
              '        "Raw provider status is retained for audit."\n'
              '    ),\n'
              '    "grid_position": (',
              '    "status_class": (\n'
              '        "Provider-specific normalized label: finished, classified_lapped, dnf, dns or dsq. "\n'
              '        "Retained for audit context; not compared as a cross-provider hard fact because providers "\n'
              '        "can encode start participation and final classification semantics differently."\n'
              '    ),\n'
              '    "result_class": (\n'
              '        "Cross-provider comparable race-result class derived conservatively from each provider label: "\n'
              '        "completed, classified_lapped, non_finisher or disqualified. DNS and DNF both map to "\n'
              '        "non_finisher here; their start-participation distinction is carried separately."\n'
              '    ),\n'
              '    "start_status": (\n'
              '        "Start-participation evidence: started, dns or UNKNOWN. A zero-lap generic Retired/DNF label "\n'
              '        "from Jolpica/FastF1 is UNKNOWN rather than guessed started or DNS; OpenF1 explicit DNS/DNF "\n'
              '        "flags can distinguish the states."\n'
              '    ),\n'
              '    "grid_position": (',
          )
          marker = '\n\ndef _pit_counts_jolpica(payload: dict[str, Any] | None) -> tuple[bool, dict[str, int]]:'
          helpers = '''\n\ndef _result_class(row: ResultRow) -> str | None:\n    """Map provider status labels only to semantics that are comparable across sources."""\n    if row.status_class == "finished":\n        return "completed"\n    if row.status_class == "classified_lapped":\n        return "classified_lapped"\n    if row.status_class in {"dnf", "dns"}:\n        return "non_finisher"\n    if row.status_class == "dsq":\n        return "disqualified"\n    return None\n\n\ndef _start_status(row: ResultRow) -> str | None:\n    """Return start evidence without turning a zero-lap generic retirement into a guess."""\n    if row.status_class == "dns":\n        return "dns"\n    if row.status_class in {"finished", "classified_lapped"}:\n        return "started"\n    if row.status_class == "dnf":\n        if row.provider == "OpenF1":\n            return "started"\n        if row.laps is not None and row.laps > 0:\n            return "started"\n        return None\n    if row.status_class == "dsq" and row.laps is not None and row.laps > 0:\n        return "started"\n    return None\n'''
          one(marker, helpers + marker)

          old_compare = '''                for field in ("laps", "status_class"):\n                    value_a, value_b = getattr(a, field), getattr(b, field)\n                    if value_a != value_b:\n                        mismatches.append(Mismatch(\n                            provider_a,\n                            provider_b,\n                            number,\n                            field,\n                            value_a,\n                            value_b,\n                            "hard",\n                            "provider values disagree",\n                        ))\n'''
          new_compare = '''                if a.laps != b.laps:\n                    mismatches.append(Mismatch(\n                        provider_a,\n                        provider_b,\n                        number,\n                        "laps",\n                        a.laps,\n                        b.laps,\n                        "hard",\n                        "provider values disagree",\n                    ))\n\n                for field, semantic in (("result_class", _result_class), ("start_status", _start_status)):\n                    value_a, value_b = semantic(a), semantic(b)\n                    if value_a is None or value_b is None:\n                        insufficient_hard.append({\n                            "provider_a": provider_a,\n                            "provider_b": provider_b,\n                            "driver_number": number,\n                            "field": field,\n                            "value_a": value_a,\n                            "value_b": value_b,\n                            "status_class_a": a.status_class,\n                            "status_class_b": b.status_class,\n                            "reason": "at least one provider lacks comparable semantic evidence",\n                        })\n                    elif value_a != value_b:\n                        mismatches.append(Mismatch(\n                            provider_a,\n                            provider_b,\n                            number,\n                            field,\n                            value_a,\n                            value_b,\n                            "hard",\n                            "provider semantic values disagree",\n                        ))\n'''
          one(old_compare, new_compare)

          one(
              '''    normalized_payload = {\n        provider: [asdict(row) for row in rows]\n        for provider, rows in normalized.items()\n    }\n''',
              '''    normalized_payload: dict[str, list[dict[str, Any]]] = {}\n    for provider, rows in normalized.items():\n        payload_rows: list[dict[str, Any]] = []\n        for row in rows:\n            payload = asdict(row)\n            payload["result_class"] = _result_class(row)\n            payload["start_status"] = _start_status(row)\n            payload_rows.append(payload)\n        normalized_payload[provider] = payload_rows\n''',
          )
          one('        "schema_version": 3,', '        "schema_version": 4,')
          one(
              '            "secondary_fields": list(SECONDARY_FIELDS),\n',
              '            "secondary_fields": list(SECONDARY_FIELDS),\n'
              '            "raw_status_class_is_audit_only": True,\n',
          )
          src_path.write_text(text)

          test_path = Path('tests/test_provider_reconciliation.py')
          tests = test_path.read_text()
          tests += r'''\n\ndef test_dns_vs_zero_lap_retired_is_semantic_gap_not_false_hard_mismatch():\n    support = ResultRow("Jolpica", 1, 1, 57, "finished")\n    providers = {\n        "Jolpica": [support, ResultRow("Jolpica", 6, 2, 0, "dnf")],\n        "FastF1": [\n            ResultRow("FastF1", 1, 1, 57, "finished"),\n            ResultRow("FastF1", 6, 2, 0, "dnf"),\n        ],\n        "OpenF1": [\n            ResultRow("OpenF1", 1, 1, 57, "finished"),\n            ResultRow("OpenF1", 6, None, 0, "dns"),\n        ],\n    }\n    report = reconcile_results(providers)\n    assert report["passed"] is True\n    assert report["verification_status"] == "PASS_WITH_GAPS"\n    assert report["hard_mismatch_count"] == 0\n    assert not [m for m in report["mismatches"] if m["driver_number"] == 6 and m["field"] == "status_class"]\n    assert any(gap["driver_number"] == 6 and gap["field"] == "start_status" for gap in report["insufficient_hard_evidence"])\n    normalized = {\n        provider: {row["driver_number"]: row for row in rows}\n        for provider, rows in report["normalized"].items()\n    }\n    assert normalized["OpenF1"][6]["result_class"] == "non_finisher"\n    assert normalized["OpenF1"][6]["start_status"] == "dns"\n    assert normalized["Jolpica"][6]["result_class"] == "non_finisher"\n    assert normalized["Jolpica"][6]["start_status"] is None\n\n\ndef test_genuine_result_class_disagreement_remains_hard_failure():\n    providers = {\n        "Jolpica": [\n            ResultRow("Jolpica", 1, 1, 57, "finished"),\n            ResultRow("Jolpica", 6, 2, 0, "dnf"),\n        ],\n        "OpenF1": [\n            ResultRow("OpenF1", 1, 1, 57, "finished"),\n            ResultRow("OpenF1", 6, 2, 0, "finished"),\n        ],\n    }\n    report = reconcile_results(providers)\n    assert report["passed"] is False\n    assert any(\n        row["driver_number"] == 6\n        and row["field"] == "result_class"\n        and row["severity"] == "hard"\n        for row in report["mismatches"]\n    )\n'''
          test_path.write_text(tests)
          PY
      - name: Ruff and reconciliation tests
        run: |
          python -m ruff check src/f1_research/provider_reconciliation.py tests/test_provider_reconciliation.py tests/test_provider_reconciliation_semantics.py tests/test_provider_reconciliation_position_semantics.py
          python -m pytest -q tests/test_provider_reconciliation.py tests/test_provider_reconciliation_semantics.py tests/test_provider_reconciliation_position_semantics.py tests/test_provider_event_identity.py tests/test_openf1_client_provenance.py
      - name: Real Australia three-provider audit
        run: |
          python -m f1_research.provider_audit --year 2025 --round 1 --openf1-session-key 9693 --cache data/reconciliation-cache --output reports/status-v4-australia
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('reports/status-v4-australia/reconciliation.json').read_text())
          assert report['hard_mismatch_count'] == 0, report['mismatches']
          assert report['verification_status'] == 'PASS_WITH_GAPS', report['verification_status']
          rows = {r['driver_number']: r for r in report['normalized']['OpenF1']}
          assert rows[6]['status_class'] == 'dns'
          assert rows[6]['result_class'] == 'non_finisher'
          assert rows[6]['start_status'] == 'dns'
          print(json.dumps({
              'verification_status': report['verification_status'],
              'hard_mismatch_count': report['hard_mismatch_count'],
              'insufficient_hard_count': report['insufficient_hard_count'],
              'hadjar': rows[6],
          }, indent=2))
          PY
      - name: Commit verified source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/f1_research/provider_reconciliation.py tests/test_provider_reconciliation.py
          git commit -m 'Separate result and start status semantics'
          git push origin HEAD:audit/status-semantics-v4
